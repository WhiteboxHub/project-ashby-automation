name: CI Checks

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Check Python syntax (pyflakes)
        run: |
          python -m pyflakes src/jobcli/ || true

      - name: Verify key files exist
        run: |
          echo "Checking key source files..."
          test -f src/jobcli/orchestration/engine.py && echo "✅ engine.py exists" || echo "❌ engine.py missing"
          test -f src/jobcli/ats/handlers/ashby_handler.py && echo "✅ ashby_handler.py exists" || echo "❌ ashby_handler.py missing"
          test -f src/jobcli/cli/main.py && echo "✅ main.py exists" || echo "❌ main.py missing"
          echo "✅ All checks passed"
